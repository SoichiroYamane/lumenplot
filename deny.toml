# cargo-deny policy for dependency review.
# This is not the project's SPDX declaration. The project license decision is
# MIT OR Apache-2.0 and must be recorded separately in Cargo/package metadata.

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# Dependencies must use an explicitly approved permissive license expression.
# This list is separate from the project's MIT OR Apache-2.0 license choice.
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # hexf-parse 0.2.1, a crates.io transitive dependency of naga/wgpu 29.0.4.
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = []
