# Activated from scripts/phase3b-ci-job-proposal.yml after the backend module
# landed (ADR 0015 §12 orders this evidence last). The proposal document keeps
# the original rationale and the activation checklist this file satisfies.
name: Phase-3B wheel and entry-point evidence

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase3b-wheel-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase3b-wheel-evidence:
    name: Phase-3B wheel build, install, and surface probe
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: 1.89.0

      - name: Run wheel-evidence probe
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_phase3b_wheel_evidence.py --probe --workdir "$RUNNER_TEMP/phase3b-probe" | tee "$RUNNER_TEMP/phase3b-manifest.json"

      - name: Upload evidence manifest
        # Convenience evidence for reviewers; release claims remain gated by
        # the offline containerized Phase-3A2 supply-chain lane.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3b-wheel-manifest
          path: ${{ runner.temp }}/phase3b-manifest.json
          retention-days: 7
          if-no-files-found: error
