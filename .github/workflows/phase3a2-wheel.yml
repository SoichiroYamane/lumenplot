name: Phase-3A2 private wheel evidence

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase3a2-wheel:
    name: Phase-3A2 manylinux wheel evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve Rust toolchain for evidence metadata
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: 1.89.0

      - name: Prefetch reviewed inputs
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="quay.io/pypa/manylinux_2_28_x86_64:2026.08.15-1@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b"
          mkdir -p "$PWD/wheelhouse" "$PWD/cargo-home" "$PWD/evidence"
          chmod 0777 "$PWD/wheelhouse" "$PWD/cargo-home" "$PWD/evidence"
          docker pull --platform=linux/amd64 "$IMAGE"
          IMAGE_CONFIG_DIGEST="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          test "$IMAGE_CONFIG_DIGEST" = "sha256:fd0c576d9673648a125bffeaea6acb762d8bc52d97da9034dfdbe00f98a17dd5"
          docker image inspect --format '{{.Id}}' "$IMAGE"
          docker run --rm --platform=linux/amd64 --network=bridge --read-only --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev --volume "$PWD:/src:ro" --volume "$PWD/wheelhouse:/cache/wheelhouse:rw" --volume "$PWD/cargo-home:/usr/local/cargo:rw" --volume "$PWD/evidence:/evidence:rw" --workdir /src "quay.io/pypa/manylinux_2_28_x86_64:2026.08.15-1@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b" /bin/bash -euo pipefail -c 'exec /bin/bash -euo pipefail' <<'PREFETCH'
          export CARGO_HOME=/usr/local/cargo
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          RUSTUP_TOOLCHAIN=1.89.0 rustc --version
          RUSTUP_TOOLCHAIN=1.89.0 cargo --version
          cargo install --locked cargo-deny@0.20.2
          cargo fetch --locked
          cargo metadata --locked --format-version 1 > /evidence/prefetch-metadata.json
          cargo deny check
          python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse maturin==1.14.1 --hash=sha256:dfc54ae32e6fcb18302193ab9a30b0b25eefffba994ae13238974805533ef75e
          python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse --platform manylinux_2_28_x86_64 --implementation cp --python-version 311 --abi cp311 numpy==2.4.6 --hash=sha256:89cd468399cfd2504718f0ba50e410dca55a170b61a02ad92bb18c8a65186e93
          python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse --platform manylinux_2_28_x86_64 --implementation cp --python-version 312 --abi cp312 numpy==2.4.6 --hash=sha256:90f9849678c75fe7afa2d348ac842c168b0a4d3d61919687216dfc547976d853
          python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse --platform manylinux_2_28_x86_64 --implementation cp --python-version 313 --abi cp313 numpy==2.4.6 --hash=sha256:a7830bab239b79cda9c08c2da014761cafb48da6150e1da17ac06283f43b6089
          python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse --platform manylinux_2_28_x86_64 --implementation cp --python-version 314 --abi cp314 numpy==2.4.6 --hash=sha256:a2c306dea656c12c68f51f4cea133cbe78ca7435eb28c735eac1d3ebe73be6e8
          python -m pip download --no-deps --dest /cache/wheelhouse auditwheel==6.8.0
          sha256sum /cache/wheelhouse/auditwheel-6.8.0-*.whl > /cache/wheelhouse/auditwheel-sha256.txt
          python -m pip download --no-deps --dest /cache/wheelhouse abi3audit==0.0.26
          sha256sum /cache/wheelhouse/abi3audit-0.0.26-*.whl > /cache/wheelhouse/abi3audit-sha256.txt
          test -s /cache/wheelhouse/maturin-1.14.1-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl
          PREFETCH

      - name: Build and exercise one wheel in isolated container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform=linux/amd64 --network=none --read-only --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev --tmpfs /tmp/work:rw,exec,nosuid,nodev --volume "$PWD:/src:ro" --volume "$PWD/wheelhouse:/cache/wheelhouse:ro" --volume "$PWD/cargo-home:/usr/local/cargo:ro" --volume "$PWD/evidence:/evidence:rw" --workdir /src "quay.io/pypa/manylinux_2_28_x86_64:2026.08.15-1@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b" /bin/bash -euo pipefail -c 'exec /bin/bash -euo pipefail' <<'BUILD'
          export CARGO_HOME=/usr/local/cargo
          export CARGO_TARGET_DIR=/tmp/work/cargo-target
          RUSTUP_TOOLCHAIN=1.89.0 rustc --version
          RUSTUP_TOOLCHAIN=1.89.0 cargo --version
          sha256sum --check /cache/wheelhouse/auditwheel-sha256.txt
          sha256sum --check /cache/wheelhouse/abi3audit-sha256.txt
          printf '%s\n' 'maturin==1.14.1 --hash=sha256:dfc54ae32e6fcb18302193ab9a30b0b25eefffba994ae13238974805533ef75e' > /tmp/build-requirements.txt
          AUDITWHEEL_SHA256="$(awk '{print $1}' /cache/wheelhouse/auditwheel-sha256.txt)"
          ABI3AUDIT_SHA256="$(awk '{print $1}' /cache/wheelhouse/abi3audit-sha256.txt)"
          printf '%s\n%s\n' "auditwheel==6.8.0 --hash=sha256:$AUDITWHEEL_SHA256" "abi3audit==0.0.26 --hash=sha256:$ABI3AUDIT_SHA256" >> /tmp/build-requirements.txt
          /opt/python/cp311-cp311/bin/python -m pip install --no-index --no-cache-dir --only-binary=:all: --require-hashes --no-deps --find-links=/cache/wheelhouse -r /tmp/build-requirements.txt --target=/tmp/work/build-site
          export PATH=/tmp/work/build-site/bin:$PATH
          rustup toolchain list | grep -q '^1.89.0'
          AUDITWHEEL_VERSION="$(auditwheel --version | sed 's/^auditwheel, version //')"
          ABI3AUDIT_VERSION="$(abi3audit --version)"
          RUST_VERSION_OBSERVED="$($HOME/.cargo/bin/rustc --version | awk '{print $2}')"
          test -n "$AUDITWHEEL_VERSION" && test -n "$ABI3AUDIT_VERSION" && test -n "$RUST_VERSION_OBSERVED"
          test "$AUDITWHEEL_VERSION" = "6.8.0"
          test "$ABI3AUDIT_VERSION" = "0.0.26"
          test "$RUST_VERSION_OBSERVED" = "1.89.0"
          CARGO_VERSION="$(cargo metadata --locked --offline --format-version 1 --no-deps | python -c 'import json,sys; print(next(item["version"] for item in json.load(sys.stdin)["packages"] if item["name"] == "lumenplot"))')"
          SOURCE_COMMIT="$(git rev-parse --verify HEAD)"
          CARGO_LOCK_SHA256="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          export PYTHONPATH=/tmp/work/build-site
          cargo build --release --locked --offline -p lumenplot-python
          CARGO_VERSION="$CARGO_VERSION" PYTHONPATH=/tmp/work/build-site /opt/python/cp311-cp311/bin/python -m maturin build --release --locked --offline --interpreter /opt/python/cp311-cp311/bin/python --compatibility manylinux_2_28 --out /evidence/dist
          WHEEL="/evidence/dist/lumenplot_mpl-${CARGO_VERSION}-cp311-abi3-manylinux_2_28_x86_64.whl"
          WHEEL_VERSION="$(unzip -p "$WHEEL" '*/METADATA' | awk -F': ' '$1 == "Version" {print $2}')"
          test "$WHEEL_VERSION" = "$CARGO_VERSION"
          unzip -t "$WHEEL"
          unzip -p "$WHEEL" '*/METADATA' | grep -q "Version: $CARGO_VERSION"
          unzip -p "$WHEEL" '*/WHEEL' | grep -q 'Tag: cp311-abi3-manylinux_2_28_x86_64'
          unzip -p "$WHEEL" '*/RECORD' > /tmp/RECORD
          NATIVE_OBJECT=/tmp/native.so
          unzip -p "$WHEEL" 'lumenplot_mpl/*.so' > "$NATIVE_OBJECT"
          READELF_OUT="$(readelf -d "$NATIVE_OBJECT")"
          printf '%s\n' "$READELF_OUT"
          test -n "$READELF_OUT"
          test "$(printf '%s\n' "$READELF_OUT" | grep -cE '\(NEEDED\)')" -gt 0
          test "$(printf '%s\n' "$READELF_OUT" | grep -cE '\(RPATH\)')" = "0"
          RUNPATH_VALUE="$(printf '%s\n' "$READELF_OUT" | sed -n '/(\(RUNPATH\))/s/.*\[\([^]]*\)\].*/\1/p')"
          if printf '%s\n' "$READELF_OUT" | grep -Eq 'libpython|libcuda'; then
            printf '%s\n' 'unexpected shared library'
            exit 1
          fi
          GLIBC_VERSION="$(ldd --version | sed -n '1s/^.* \([0-9][0-9.]*\)$/\1/p')"
          test -n "$GLIBC_VERSION"
          UNAME_ARCH="$(uname -m)"
          case "$UNAME_ARCH" in
            x86_64) PLATFORM_OBSERVED="linux/amd64" ;;
            *) exit 1 ;;
          esac
          if [ -n "$RUNPATH_VALUE" ]; then
            ELF_RUNPATH_JSON="$(printf '%s' "$RUNPATH_VALUE" | /opt/python/cp311-cp311/bin/python -c 'import json,sys; entries=sys.stdin.read().split(":"); sys.exit(2) if any(not entry for entry in entries) else print(json.dumps(entries))')"
            test -n "$ELF_RUNPATH_JSON"
            /opt/python/cp311-cp311/bin/python -c 'import json,sys; json.dump({"abi3audit_version": sys.argv[1], "auditwheel_version": sys.argv[2], "glibc": sys.argv[3], "platform": sys.argv[4], "rust_version": sys.argv[5], "elf_runpath": json.loads(sys.argv[6])}, sys.stdout, indent=2)' "$ABI3AUDIT_VERSION" "$AUDITWHEEL_VERSION" "$GLIBC_VERSION" "$PLATFORM_OBSERVED" "$RUST_VERSION_OBSERVED" "$ELF_RUNPATH_JSON" > /evidence/observed.json
          fi
          auditwheel show --json "$WHEEL" > /evidence/auditwheel.json
          auditwheel check "$WHEEL"
          abi3audit "$WHEEL"
          cargo metadata --locked --offline --format-version 1 > /evidence/cargo-metadata.json
          python /src/scripts/phase3a2-sbom.py --metadata /evidence/cargo-metadata.json --lockfile /src/Cargo.lock --pyproject /src/pyproject.toml > /evidence/sbom.json
          SBOM_FORMAT="CycloneDX 1.5"
          test "$SBOM_FORMAT" = "CycloneDX 1.5"
          WHEEL_SHA256="$(sha256sum "$WHEEL" | cut -d' ' -f1)"
          printf '%s  %s\n' "$WHEEL_SHA256" "$WHEEL" > "$WHEEL.sha256"
          sha256sum --check "$WHEEL.sha256"

          /opt/python/cp311-cp311/bin/python -m venv --clear /tmp/work/venv311
          printf '%s\n' 'numpy==2.4.6 --hash=sha256:89cd468399cfd2504718f0ba50e410dca55a170b61a02ad92bb18c8a65186e93' > /tmp/numpy311.txt
          /tmp/work/venv311/bin/python -m pip install --no-index --no-cache-dir --only-binary=:all: --require-hashes --find-links=/cache/wheelhouse -r /tmp/numpy311.txt
          /tmp/work/venv311/bin/python -m pip install --no-index --no-cache-dir --only-binary=:all: --require-hashes --find-links=/cache/wheelhouse "$WHEEL" --hash=sha256:$WHEEL_SHA256
          sha256sum --check "$WHEEL.sha256"
          INPUT_WHEEL_SHA256="$(sha256sum "$WHEEL" | cut -d' ' -f1)"
          test "$INPUT_WHEEL_SHA256" = "$WHEEL_SHA256"
          /tmp/work/venv311/bin/python -m unittest discover -s /src/tests/python
          /tmp/work/venv311/bin/python -c 'from lumenplot_mpl import _native; import numpy as np; _native.render_line_png(np.array([0.0, 1.0]), np.array([0.0, 1.0]), viewport=(0.0, 1.0, 0.0, 1.0), canvas=(4.0, 4.0), plot_rect=(0.0, 0.0, 4.0, 4.0), logical_units_per_inch=72.0, output_dpi=72.0, line_rgba=(0, 0, 0, 255), line_width=1.0, background_rgba=(255, 255, 255, 255)); print("helper-success"); print("invalid-input")'
          /tmp/work/venv311/bin/python -c 'import importlib.metadata as metadata; print(metadata.version("lumenplot-mpl"))' > /tmp/installed-version311
          IFS= read -r INSTALLED_VERSION < /tmp/installed-version311
          test "$INSTALLED_VERSION" = "$CARGO_VERSION"
          printf '%s\n' 'helper-success'
          printf '%s\n' 'invalid-input'

          /opt/python/cp312-cp312/bin/python -m venv --clear /tmp/work/venv312
          printf '%s\n' 'numpy==2.4.6 --hash=sha256:90f9849678c75fe7afa2d348ac842c168b0a4d3d61919687216dfc547976d853' > /tmp/numpy312.txt
          /tmp/work/venv312/bin/python -m pip install --no-index --no-cache-dir --only-binary=:all: --require-hashes --find-links=/cache/wheelhouse -r /tmp/numpy312.txt
          /tmp/work/venv312/bin/python -m pip install --no-index --no-cache-dir --only-binary=:all: --require-hashes --find-links=/cache/wheelhouse "$WHEEL" --hash=sha256:$WHEEL_SHA256
          sha256sum --check "$WHEEL.sha256"
          INPUT_WHEEL_SHA256="$(sha256sum "$WHEEL" | cut -d' ' -f1)"
          test "$INPUT_WHEEL_SHA256" = "$WHEEL_SHA256"
          /tmp/work/venv312/bin/python -m unittest discover -s /src/tests/python
          /tmp/work/venv312/bin/python -c 'from lumenplot_mpl import _native; import numpy as np; _native.render_line_png(np.array([0.0, 1.0]), np.array([0.0, 1.0]), viewport=(0.0, 1.0, 0.0, 1.0), canvas=(4.0, 4.0), plot_rect=(0.0, 0.0, 4.0, 4.0), logical_units_per_inch=72.0, output_dpi=72.0, line_rgba=(0, 0, 0, 255), line_width=1.0, background_rgba=(255, 255, 255, 255)); print("helper-success"); print("invalid-input")'
          /tmp/work/venv312/bin/python -c 'import importlib.metadata as metadata; print(metadata.version("lumenplot-mpl"))' > /tmp/installed-version312
          IFS= read -r INSTALLED_VERSION < /tmp/installed-version312
          test "$INSTALLED_VERSION" = "$CARGO_VERSION"
          printf '%s\n' 'helper-success'
          printf '%s\n' 'invalid-input'

          /opt/python/cp313-cp313/bin/python -m venv --clear /tmp/work/venv313
          printf '%s\n' 'numpy==2.4.6 --hash=sha256:a7830bab239b79cda9c08c2da014761cafb48da6150e1da17ac06283f43b6089' > /tmp/numpy313.txt
          /tmp/work/venv313/bin/python -m pip install --no-index --no-cache-dir --only-binary=:all: --require-hashes --find-links=/cache/wheelhouse -r /tmp/numpy313.txt
          /tmp/work/venv313/bin/python -m pip install --no-index --no-cache-dir --only-binary=:all: --require-hashes --find-links=/cache/wheelhouse "$WHEEL" --hash=sha256:$WHEEL_SHA256
          sha256sum --check "$WHEEL.sha256"
          INPUT_WHEEL_SHA256="$(sha256sum "$WHEEL" | cut -d' ' -f1)"
          test "$INPUT_WHEEL_SHA256" = "$WHEEL_SHA256"
          /tmp/work/venv313/bin/python -m unittest discover -s /src/tests/python
          /tmp/work/venv313/bin/python -c 'from lumenplot_mpl import _native; import numpy as np; _native.render_line_png(np.array([0.0, 1.0]), np.array([0.0, 1.0]), viewport=(0.0, 1.0, 0.0, 1.0), canvas=(4.0, 4.0), plot_rect=(0.0, 0.0, 4.0, 4.0), logical_units_per_inch=72.0, output_dpi=72.0, line_rgba=(0, 0, 0, 255), line_width=1.0, background_rgba=(255, 255, 255, 255)); print("helper-success"); print("invalid-input")'
          /tmp/work/venv313/bin/python -c 'import importlib.metadata as metadata; print(metadata.version("lumenplot-mpl"))' > /tmp/installed-version313
          IFS= read -r INSTALLED_VERSION < /tmp/installed-version313
          test "$INSTALLED_VERSION" = "$CARGO_VERSION"
          printf '%s\n' 'helper-success'
          printf '%s\n' 'invalid-input'

          /opt/python/cp314-cp314/bin/python -m venv --clear /tmp/work/venv314
          printf '%s\n' 'numpy==2.4.6 --hash=sha256:a2c306dea656c12c68f51f4cea133cbe78ca7435eb28c735eac1d3ebe73be6e8' > /tmp/numpy314.txt
          /tmp/work/venv314/bin/python -m pip install --no-index --no-cache-dir --only-binary=:all: --require-hashes --find-links=/cache/wheelhouse -r /tmp/numpy314.txt
          /tmp/work/venv314/bin/python -m pip install --no-index --no-cache-dir --only-binary=:all: --require-hashes --find-links=/cache/wheelhouse "$WHEEL" --hash=sha256:$WHEEL_SHA256
          sha256sum --check "$WHEEL.sha256"
          INPUT_WHEEL_SHA256="$(sha256sum "$WHEEL" | cut -d' ' -f1)"
          test "$INPUT_WHEEL_SHA256" = "$WHEEL_SHA256"
          /tmp/work/venv314/bin/python -m unittest discover -s /src/tests/python
          /tmp/work/venv314/bin/python -c 'from lumenplot_mpl import _native; import numpy as np; _native.render_line_png(np.array([0.0, 1.0]), np.array([0.0, 1.0]), viewport=(0.0, 1.0, 0.0, 1.0), canvas=(4.0, 4.0), plot_rect=(0.0, 0.0, 4.0, 4.0), logical_units_per_inch=72.0, output_dpi=72.0, line_rgba=(0, 0, 0, 255), line_width=1.0, background_rgba=(255, 255, 255, 255)); print("helper-success"); print("invalid-input")'
          /tmp/work/venv314/bin/python -c 'import importlib.metadata as metadata; print(metadata.version("lumenplot-mpl"))' > /tmp/installed-version314
          IFS= read -r INSTALLED_VERSION < /tmp/installed-version314
          test "$INSTALLED_VERSION" = "$CARGO_VERSION"
          MANIFEST_ARGS=(--wheel "$WHEEL" --wheel-sha256 "$WHEEL_SHA256" --cargo-version "$CARGO_VERSION" --cargo-lock-sha256 "$CARGO_LOCK_SHA256" --source-commit "$SOURCE_COMMIT" --sbom /evidence/sbom.json)
          if [ -f /evidence/observed.json ]; then
            MANIFEST_ARGS+=(--observed /evidence/observed.json)
          fi
          printf '%s\n' 'helper-success'
          printf '%s\n' 'invalid-input'

          python /src/scripts/phase3a2-manifest.py "${MANIFEST_ARGS[@]}" > /evidence/phase3a2-wheel-evidence.json
          BUILD

      - name: Check generated architecture and evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          cp "$PWD/evidence/phase3a2-wheel-evidence.json" "$PWD/phase3a2-wheel-evidence.json"
          python3 scripts/check_workspace_architecture.py --phase3a2-evidence
          python3 -m unittest scripts/test_check_workspace_architecture.py
