      - name: Check generated architecture and evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          cp "$PWD/evidence/phase3a2-wheel-evidence.json" "$PWD/phase3a2-wheel-evidence.json"
          # The mutation-test harness builds an external-consumer crate with
          # CARGO_NET_OFFLINE=true, which resolves against the host cargo
          # warm it the same way ci.yml does before the run.
          cargo fetch --locked
          python3 scripts/test_phase3b_runtime.py --verify-evidence \
            evidence/phase3b-runtime-cp311.json \
            evidence/phase3b-runtime-cp312.json \
            evidence/phase3b-runtime-cp313.json \
            evidence/phase3b-runtime-cp314.json
          python3 scripts/check_workspace_architecture.py --phase3a2-evidence
          python3 -m unittest scripts.test_phase3b_runtime
          python3 -m unittest scripts/test_check_workspace_architecture.py

      - name: Upload packaged Phase-3B runtime evidence
        # Evidence storage only; this is not a release or publication path.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3b-public-backend-runtime
          path: evidence/phase3b-runtime-cp*.json
          retention-days: 7
          if-no-files-found: error
