name: Phase-3A2 private wheel evidence

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # Hash-pinned rustup-init bootstrap binary for x86_64-unknown-linux-gnu.
  # Digest probed from
  # https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
  # and cross-checked against the published rustup-init.sha256 sidecar;
  # re-probe both before any bump.
  PHASE3A2_RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"

jobs:
  phase3a2-wheel:
    name: Phase-3A2 manylinux wheel evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve Rust toolchain for evidence metadata
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: 1.89.0

      - name: Prefetch reviewed inputs
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="quay.io/pypa/manylinux_2_28_x86_64:2026.08.15-1@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b"
          mkdir -p "$PWD/wheelhouse" "$PWD/cargo-home" "$PWD/evidence"
          chmod 0777 "$PWD/wheelhouse" "$PWD/cargo-home" "$PWD/evidence"
          docker pull --platform=linux/amd64 "$IMAGE"
          IMAGE_CONFIG_DIGEST="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          test "$IMAGE_CONFIG_DIGEST" = "sha256:fd0c576d9673648a125bffeaea6acb762d8bc52d97da9034dfdbe00f98a17dd5"
          docker image inspect --format '{{.Id}}' "$IMAGE"
          docker run --rm --platform=linux/amd64 --network=bridge --read-only --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges -e PHASE3A2_RUSTUP_INIT_SHA256 --tmpfs /tmp:rw,noexec,nosuid,nodev --tmpfs /tmp/work:rw,exec,nosuid,nodev -i --volume "$PWD:/src:ro" --volume "$PWD/wheelhouse:/cache/wheelhouse:rw" --volume "$PWD/cargo-home:/usr/local/cargo:rw" --volume "$PWD/evidence:/evidence:rw" --workdir /src "quay.io/pypa/manylinux_2_28_x86_64:2026.08.15-1@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b" /bin/bash -euo pipefail -c 'exec /bin/bash -euo pipefail' <<'PREFETCH'
          # Visibility diagnostic: if this line is absent from CI logs, the
          # heredoc stdin never reached the container shell; if present, the
          # inner shell is executing (discriminates transport vs script bugs).
          printf '%s\n' "prefetch-inner-shell: heredoc reached container shell, cwd=$(pwd)"
          export CARGO_HOME=/usr/local/cargo
          export RUSTUP_HOME=/usr/local/cargo/rustup
          # /tmp stays noexec: cargo's default per-install staging target lives
          # under $TMPDIR, where build-script binaries cannot be executed.
          export CARGO_TARGET_DIR=/tmp/work/cargo-target
          # Hash-pinned rustup bootstrap: the pinned manylinux image does not
          # ship rustup, so provision it from the recorded rustup-init digest.
          printf '%s  rustup-init\n' "$PHASE3A2_RUSTUP_INIT_SHA256" > /tmp/rustup-init.sha256
          curl --proto '=https' --tlsv1.2 --silent --show-error --location \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
            > /tmp/work/rustup-init
          # Resolve the digest-listed name against the staging directory, not CWD=/src.
          ( cd /tmp/work && sha256sum --check /tmp/rustup-init.sha256 )
          # curl redirection creates the file mode 0644; direct execve needs the
          # executable bit set before the bootstrap can start.
          chmod +x /tmp/work/rustup-init
          # /tmp stays noexec; only the exec-mounted work tmpfs may run binaries.
          /tmp/work/rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.89.0
          export PATH=/usr/local/cargo/bin:$PATH
          rustc --version
          cargo --version
          cargo install --locked cargo-deny@0.20.2
          cargo fetch --locked
          cargo metadata --locked --format-version 1 > /evidence/prefetch-metadata.json
          cargo deny check
          # pip's `--hash` is a requirements-file-only option: no pip release
          # registers it as a CLI flag, so each reviewed input carries its pin
          # in a one-line requirements file consumed with --require-hashes.
          printf '%s\n' 'maturin==1.14.1 --hash=sha256:dfc54ae32e6fcb18302193ab9a30b0b25eefffba994ae13238974805533ef75e' > /tmp/wheelhouse-maturin.txt
          /opt/python/cp311-cp311/bin/python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse -r /tmp/wheelhouse-maturin.txt
          printf '%s\n' 'numpy==2.4.6 --hash=sha256:89cd468399cfd2504718f0ba50e410dca55a170b61a02ad92bb18c8a65186e93' > /tmp/wheelhouse-numpy311.txt
          /opt/python/cp311-cp311/bin/python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse --platform manylinux_2_28_x86_64 --implementation cp --python-version 311 --abi cp311 -r /tmp/wheelhouse-numpy311.txt
          printf '%s\n' 'numpy==2.4.6 --hash=sha256:90f9849678c75fe7afa2d348ac842c168b0a4d3d61919687216dfc547976d853' > /tmp/wheelhouse-numpy312.txt
          /opt/python/cp311-cp311/bin/python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse --platform manylinux_2_28_x86_64 --implementation cp --python-version 312 --abi cp312 -r /tmp/wheelhouse-numpy312.txt
          printf '%s\n' 'numpy==2.4.6 --hash=sha256:a7830bab239b79cda9c08c2da014761cafb48da6150e1da17ac06283f43b6089' > /tmp/wheelhouse-numpy313.txt
          /opt/python/cp311-cp311/bin/python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse --platform manylinux_2_28_x86_64 --implementation cp --python-version 313 --abi cp313 -r /tmp/wheelhouse-numpy313.txt
          printf '%s\n' 'numpy==2.4.6 --hash=sha256:a2c306dea656c12c68f51f4cea133cbe78ca7435eb28c735eac1d3ebe73be6e8' > /tmp/wheelhouse-numpy314.txt
          /opt/python/cp311-cp311/bin/python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse --platform manylinux_2_28_x86_64 --implementation cp --python-version 314 --abi cp314 -r /tmp/wheelhouse-numpy314.txt
          # Matplotlib runtime stack (Phase-3B backend dependency): one
          # requirements file per supported CPython minor version, each with
          # the full eight-wheel tree (matplotlib + contourpy + cycler +
          # fonttools + kiwisolver + pillow + pyparsing + python-dateutil).
          # cp311-cp313 compiled wheels publish under the manylinux2014 tag,
          # so those downloads accept both platform tags; digests probed from
          # the PyPI release pages and re-verified by local pip downloads.
          printf '%s\n' 'matplotlib==3.11.1 --hash=sha256:aee55e9041211bf84302ab55ec3965df18dd90ae19f8b58332a7feaf208bfe83' > /tmp/wheelhouse-mpl311.txt
          printf '%s\n' 'contourpy==1.3.3 --hash=sha256:51e79c1f7470158e838808d4a996fa9bac72c498e93d8ebe5119bc1e6becb0db' >> /tmp/wheelhouse-mpl311.txt
          printf '%s\n' 'cycler==0.12.1 --hash=sha256:85cef7cff222d8644161529808465972e51340599459b8ac3ccbac5a854e0d30' >> /tmp/wheelhouse-mpl311.txt
          printf '%s\n' 'fonttools==4.63.0 --hash=sha256:d76ac49f929aecaf82d83250b8347e099d7aecba0f4726c1d9b6df3b8bb5fe18' >> /tmp/wheelhouse-mpl311.txt
          printf '%s\n' 'kiwisolver==1.5.0 --hash=sha256:2517e24d7315eb51c10664cdb865195df38ab74456c677df67bb47f12d088a27' >> /tmp/wheelhouse-mpl311.txt
          printf '%s\n' 'pillow==12.3.0 --hash=sha256:23d27a3e0307ec2244cc51e7287b919aa68d097504ebe19df4e76a98a3eea5bd' >> /tmp/wheelhouse-mpl311.txt
          printf '%s\n' 'pyparsing==3.3.2 --hash=sha256:850ba148bd908d7e2411587e247a1e4f0327839c40e2e5e6d05a007ecc69911d' >> /tmp/wheelhouse-mpl311.txt
          printf '%s\n' 'python-dateutil==2.9.0.post0 --hash=sha256:a8b2bc7bffae282281c8140a97d3aa9c14da0b136dfe83f850eea9a5f7470427' >> /tmp/wheelhouse-mpl311.txt
          printf '%s\n' 'packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c' >> /tmp/wheelhouse-mpl311.txt
          printf '%s\n' 'six==1.17.0 --hash=sha256:4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274' >> /tmp/wheelhouse-mpl311.txt
          /opt/python/cp311-cp311/bin/python -m pip download --no-deps --only-binary=:all: --require-hashes --dest /cache/wheelhouse --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 --implementation cp --python-version 311 --abi cp311 -r /tmp/wheelhouse-mpl311.txt
          printf '%s\n' 'matplotlib==3.11.1 --hash=sha256:ba8f811b8ddfac493734d6af0b2dff96919d0c28ca0d641858dab4262777c6ea' > /tmp/wheelhouse-mpl312.txt
          printf '%s\n' 'contourpy==1.3.3 --hash=sha256:4d00e655fcef08aba35ec9610536bfe90267d7ab5ba944f7032549c55a146da1' >> /tmp/wheelhouse-mpl312.txt
