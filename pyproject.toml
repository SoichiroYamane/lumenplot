[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "lumenplot-mpl"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy==2.4.6"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/lumenplot-python/Cargo.toml"
module-name = "lumenplot_mpl._native"
python-source = "python"
