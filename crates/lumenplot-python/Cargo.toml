[package]
name = "lumenplot-python"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
lumenplot = { path = "../lumenplot", version = "0.1.0" }
pyo3 = { version = "=0.29.2", default-features = false, features = ["macros", "extension-module", "abi3-py311"] }
numpy = { version = "=0.29.0", default-features = false }
png = { version = "=0.18.1", default-features = false }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
