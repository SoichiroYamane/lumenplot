[package]
name = "lumenplot-window"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
readme.workspace = true

# WINAPP contract lane (commander ruling 2026-09-13; ADR 0003 amendment):
# skeletal window/event host over runtime + render-wgpu. The only permitted
# external edge is pinned winit 0.30.x (baseline ADR 0008: 0.30.13); the M1
# lane materializes it here with default platform backends. The
# architecture checker pins this exact table fail-closed.
[dependencies]
lumenplot-runtime = { path = "../lumenplot-runtime", version = "0.1.0" }
lumenplot-render-wgpu = { path = "../lumenplot-render-wgpu", version = "0.1.0" }
winit = { version = "=0.30.13" }
