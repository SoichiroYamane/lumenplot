[package]
name = "lumenplot-bench"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
readme.workspace = true

# The strict/hybrid profiles drive the accepted private PNG facade, while the
# accelerated profile resolves the M1 frame seam and submits its packet to the
# portable offscreen renderer. The bench crate therefore carries only the
# internal workspace edges needed by those paths:
# `lumenplot-engine::bridge::{SrgbRgba8, Viewport}` for seam arguments,
# `lumenplot-render-api` for `SceneHandle`/`FrameSpec`, and
# `lumenplot-render-wgpu` for the renderer owner. No registry dependency is
# added; the external inventory stays empty and the architecture/dependency
# checkers pin this exact table while their bench sentinels are active
# (fail-closed).
[dependencies]
lumenplot = { path = "../lumenplot", version = "0.1.0" }
lumenplot-engine = { path = "../lumenplot-engine", version = "0.1.0" }
lumenplot-render-api = { path = "../lumenplot-render-api", version = "0.1.0" }
lumenplot-render-wgpu = { path = "../lumenplot-render-wgpu", version = "0.1.0" }
