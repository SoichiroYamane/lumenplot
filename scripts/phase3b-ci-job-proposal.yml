# PROPOSED job — not active. See phase3b-ci-job-proposal.md for rationale
# and the activation checklist. This file must not be moved under
# .github/workflows/ without a reviewed decision (ADR 0015 §12 orders this
# evidence after the backend implementation lane lands).
name: Phase-3B wheel and entry-point evidence

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  phase3b-wheel-evidence:
    name: Phase-3B wheel build, install, and surface probe
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: 1.89.0

      - name: Set up CPython for the probe
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Run wheel-evidence probe
        run: |
          python3 scripts/test_phase3b_wheel_evidence.py --probe --workdir "$RUNNER_TEMP/phase3b-probe" | tee "$RUNNER_TEMP/phase3b-manifest.json"

      - name: Upload evidence manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3b-wheel-manifest
          path: ${{ runner.temp }}/phase3b-manifest.json
          if-no-files-found: error
